<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="./index.js"></script>
  <link rel="stylesheet" href="./index.css">
  <title>BSW-Dash</title>
</head>
<body>
    <!-- メインの表示部 -->
    <div id="display">
        <div id="info" class="active">
            <h1 class="title">INFO</h1>
            <h2>ServerName:<span id="ServerName">...</span></h2>
            <h2>Player:<span id="Player">../..</span></h2>
            <h2>Version:<span id="Version">...</span></h2>
            <h2>BSW-Version:<span id="BSWVersion">...</span></h2>

            <h2>All-Backup:<span id="all-backup">...</span></h2>
            <h2>Today-Backup:<span id="today-backup">...</span></h2>
            <div id="cpu-bar">
                <h4>CPU</h4>
                <div class="bar" id="cpu"><div class="fill"></div></div>
            </div> 
            <div id="mem-bar">
                <h4>MEM</h4>
                <div class="bar" id="mem"><div class="fill"></div></div>
            </div>

        </div>
        
        <div id="player" class="close" style="display: none;">
            <h1 class="title">PLAYER</h1>
            <ul id="players">
            </ul>
        </div>

        <div id="console" class="close" style="display: none;">
            <h1 class="title">CONSOLE</h1>
            <div id="console-log">
            </div>
            <div id="console-bar">
                <input type="text" id="cmd">
                <button id="submit">送信</button>
            </div>
        </div>


    </div>

    <!-- 下のバー -->
    <div id="bottom-bar">
        <button id="btn-info">Info</button>
        <button id="btn-player">Player</button>
        <button id="btn-console">Console</button>
    </div>
</body>
</html>
